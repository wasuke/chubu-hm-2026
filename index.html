<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>NEBUTA GS VR Viewer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;touch-action:none}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:#000}
#stage canvas{position:absolute;left:0!important;top:0!important;width:100%!important;height:100%!important;display:block}
#topbar{position:fixed;top:max(12px,env(safe-area-inset-top));left:max(72px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));display:flex;justify-content:flex-end;gap:8px;z-index:50;pointer-events:none}
.pill{pointer-events:auto;border:0;border-radius:999px;padding:11px 16px;font-size:15px;font-weight:700;color:#111;background:rgba(255,255,255,.92);box-shadow:0 2px 12px rgba(0,0,0,.3)}
#resetButton{color:#fff;background:rgba(20,20,20,.78);border:1px solid rgba(255,255,255,.3)}
#reloadButton{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:100;border:0;border-radius:999px;padding:10px 14px;font-size:14px;font-weight:700;color:#111;background:rgba(255,255,255,.88);box-shadow:0 2px 12px rgba(0,0,0,.35)}
#vrExit{display:none;position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:100;border:0;border-radius:999px;padding:9px 15px;font-size:14px;font-weight:700;color:#111;background:rgba(255,255,255,.8)}
#divider{display:none;position:fixed;left:50%;top:0;width:1px;height:100vh;height:100dvh;transform:translateX(-.5px);background:rgba(255,255,255,.35);z-index:40;pointer-events:none}
.reticle{position:fixed;width:18px;height:18px;border:2px solid rgba(255,255,255,.95);border-radius:50%;transform:translate(-50%,-50%);z-index:80;pointer-events:none;box-shadow:0 0 2px #000,0 0 5px rgba(0,0,0,.8)}
#normalReticle{left:50%;top:50%}
#leftReticle{display:none;left:31%;top:50%}
#rightReticle{display:none;left:69%;top:50%}
#hint{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;padding:10px 14px;color:#fff;font-size:13px;white-space:nowrap;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.2);border-radius:14px;pointer-events:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:200;color:#fff;background:#000;font-size:16px;text-align:center}
#loading small{display:block;margin-top:8px;opacity:.7}
body.vr #topbar,body.vr #hint,body.vr #normalReticle{display:none}
body.vr #vrExit,body.vr #divider,body.vr #leftReticle,body.vr #rightReticle{display:block}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="stage"></div>
<button id="reloadButton">再読み込み</button>
<div id="topbar"><button id="resetButton" class="pill">初期位置</button><button id="vrButton" class="pill">VR表示</button></div>
<button id="vrExit">VRを終了</button>
<div id="divider"></div>
<div id="normalReticle" class="reticle"></div>
<div id="leftReticle" class="reticle"></div>
<div id="rightReticle" class="reticle"></div>
<div id="hint">1本指：見る方向　2本指：近づく・離れる</div>
<div id="loading"><div>ねぶたの3D空間を読み込んでいます…<small>初回は数十秒かかることがあります</small></div></div>
<script type="module" src="./app.js"></script>
</body>
</html>
