<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>NEBUTA GS VR Viewer</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; touch-action:none; }
    #stage { position:fixed; inset:0; }
    canvas { display:block; width:100%; height:100%; }
    #topbar { position:fixed; top:max(12px,env(safe-area-inset-top)); left:12px; right:12px; display:flex; gap:8px; align-items:center; z-index:20; pointer-events:none; }
    .pill { pointer-events:auto; border:0; border-radius:999px; padding:11px 16px; font-weight:700; font-size:15px; background:rgba(255,255,255,.92); color:#111; box-shadow:0 2px 12px rgba(0,0,0,.25); }
    #vrButton { margin-left:auto; }
    #resetButton { background:rgba(20,20,20,.78); color:#fff; border:1px solid rgba(255,255,255,.25); }
    #hint { position:fixed; left:50%; bottom:max(18px,env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:20; color:#fff; background:rgba(0,0,0,.52); border:1px solid rgba(255,255,255,.2); border-radius:14px; padding:10px 14px; font-size:13px; text-align:center; white-space:nowrap; pointer-events:none; }
    #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:30; color:#fff; background:#000; font-size:16px; }
    #loading small { display:block; opacity:.7; margin-top:8px; text-align:center; }
    #vrExit { display:none; position:fixed; z-index:40; left:50%; top:max(8px,env(safe-area-inset-top)); transform:translateX(-50%); border:0; border-radius:999px; padding:8px 14px; background:rgba(255,255,255,.72); color:#111; font-weight:700; }
    #divider { display:none; position:fixed; z-index:10; top:0; bottom:0; left:50%; width:1px; background:rgba(255,255,255,.15); pointer-events:none; }
    body.vr #topbar, body.vr #hint { display:none; }
    body.vr #vrExit, body.vr #divider { display:block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>
  <div id="topbar">
    <button id="reloadButton" class="pill">再読み込み</button>
    <button id="resetButton" class="pill">初期位置</button>
    <button id="vrButton" class="pill">VR表示</button>
  </div>
  <button id="vrExit">VRを終了</button>
  <div id="divider"></div>
  <div id="hint">1本指：見る方向　2本指：近づく・離れる</div>
  <div id="loading">ねぶたの3D空間を読み込んでいます…<small>初回は数十秒かかることがあります</small></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
